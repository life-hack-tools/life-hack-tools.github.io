name = "lh-tools-contact-form"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

# form.lh.tools — adding this as a custom domain makes Cloudflare create the
# DNS record for this subdomain automatically on first deploy. It does not
# touch the MX / SPF records of lh.tools itself.
[[routes]]
pattern = "form.lh.tools"
custom_domain = true

# Delivery goes to Slack through an Incoming Webhook. There are deliberately no
# email bindings here: lh.tools mail runs on Google Workspace, and enabling
# Cloudflare Email Routing on the zone would add conflicting MX / SPF records.
#
# Everything below is configured on the Worker, never in this file:
#   TURNSTILE_SITE_KEY    plain variable (public key)
#   TURNSTILE_SECRET_KEY  secret
#   APP_KEYS              secret  JSON map of app slug -> key, for /app-submit
#                                 e.g. {"batto":"...","instantid":"..."}
#                                 These ship inside app bundles and are NOT
#                                 secrets; the rate limiting rule in the README
#                                 is what actually protects that route.
#   SLACK_WEBHOOK_URL     secret  The URL is the credential. Never commit it,
#                                 never paste it into an issue or PR.
