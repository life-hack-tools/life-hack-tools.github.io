name = "lh-tools-contact-form"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

# form.lh.tools — adding this as a custom domain makes Cloudflare create the
# DNS record for this subdomain automatically on first deploy. It does not
# touch the MX / SPF records of lh.tools itself.
[[routes]]
pattern = "form.lh.tools"
custom_domain = true

# Exact rate limiting: one Durable Object per bucket key (form:<ip> /
# app:<slug>:<ip>), 5 requests per 10 minutes, sliding window. Every request
# for a key reaches the same object, so the count is exact — unlike the
# bindings below (Issue #76). SQLite-backed Durable Objects are available on
# the Free plan; the KV-style storage API used in src/index.js works there.
#
# The limit and the window live in src/index.js (PRECISE_LIMIT /
# PRECISE_WINDOW_MS), not here.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Workers Rate Limiting (needs wrangler >= 4.36). This is the FIRST pass only —
# it is cheap, but counting is per Cloudflare location and eventually
# consistent. Measured in production on 2026-09-18: only 1 of 20 requests sent
# 1.5 s apart from one IP was refused. The Durable Object above is what
# actually holds the line (Issue #76).
#
# `period` may only be 10 or 60, and must match RATE_LIMIT_PERIOD_SECONDS in
# src/index.js (it becomes Retry-After when this layer is the one that refuses).
#
# namespace_id must be unique within the Cloudflare account; two Workers that
# share one would share counters. No other LHTz Worker declares a rate limit
# namespace as of 2026-09-18. Do not reuse 72001 / 72002 elsewhere.
[[ratelimits]]
name = "APP_RATE_LIMITER"   # /app-submit, keyed app:<slug>:<ip>
namespace_id = "72001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "FORM_RATE_LIMITER"  # /submit, keyed form:<ip>
namespace_id = "72002"
simple = { limit = 3, period = 60 }

# Delivery goes to Slack through an Incoming Webhook. There are deliberately no
# email bindings here: lh.tools mail runs on Google Workspace, and enabling
# Cloudflare Email Routing on the zone would add conflicting MX / SPF records.
#
# Everything below is configured on the Worker, never in this file:
#   TURNSTILE_SITE_KEY    plain variable (public key)
#   TURNSTILE_SECRET_KEY  secret
#   APP_KEYS              secret  JSON map of app slug -> key, for /app-submit
#                                 e.g. {"batto":"...","instantid":"..."}
#                                 These ship inside app bundles and are NOT
#                                 secrets; the rate limiting rule in the README
#                                 is what actually protects that route.
#   SLACK_WEBHOOK_URL     secret  The URL is the credential. Never commit it,
#                                 never paste it into an issue or PR.
