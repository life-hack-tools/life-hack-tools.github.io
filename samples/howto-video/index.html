<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>操作説明動画の見本 - Life Hack Tools</title>
  <link rel="icon" href="/assets/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      line-height: 1.7;
      padding: 40px 16px 24px;
    }
    main { max-width: 880px; margin: 0 auto; }
    h1 { font-size: clamp(22px, 4vw, 30px); font-weight: 700; margin-bottom: 8px; }
    .lead { color: #aaa; font-size: 15px; margin-bottom: 24px; }
    video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
    }
    .caption { color: #888; font-size: 13px; margin-top: 8px; }
    .spec {
      margin-top: 32px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 20px 24px;
    }
    .spec h2 { font-size: 17px; margin-bottom: 12px; }
    .spec ul { list-style: none; }
    .spec li { padding: 4px 0; font-size: 15px; }
    .spec li span { color: #888; display: inline-block; min-width: 5.5em; }
    .note { color: #888; font-size: 13px; margin-top: 16px; }
    footer { text-align: center; padding: 32px 0 0; color: #555; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>操作説明動画の見本</h1>
    <p class="lead">アプリの 1 つの操作を、60 秒以内の字幕付き動画にしたものです。</p>

    <video controls playsinline muted preload="metadata" width="1920" height="1080" aria-label="操作説明動画の見本（音は出ません）">
      <source src="/assets/word-diary/howto-ja.mp4" type="video/mp4">
    </video>
    <p class="caption">自作のアプリ「Word Diary」で、写真を選んで言葉を入れ、保存するまでの操作（39 秒、音は出ません）。</p>

    <section class="spec">
      <h2>お引き受けする内容</h2>
      <ul>
        <li><span>対象</span>ヘルプ記事などの 1 つの操作</li>
        <li><span>長さ</span>60 秒以内</li>
        <li><span>納品</span>字幕付きの MP4、台本 1 枚</li>
        <li><span>修正</span>1 回</li>
        <li><span>料金</span>22,000 円（税込）</li>
      </ul>
      <p class="note">画面は、いただいた録画をもとに作ります。</p>
    </section>
  </main>
  <footer>© 2026 Life Hack Tools</footer>

</body>
</html>
